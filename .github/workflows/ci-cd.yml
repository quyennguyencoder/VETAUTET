name: Java CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # BƯỚC NÀY ĐỂ CẤP QUYỀN
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests # Thay bằng mvn clean verify nếu bạn muốn chạy test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/vetautet:latest

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Configuration to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "environment/"
          target: "/home/ubuntu/vetautet"

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_USERNAME
          script: |
            # 1. Di chuyển vào thư mục chứa cấu hình trên EC2
            cd /home/ubuntu/vetautet/environment

            # 2. Pull image mới nhất từ Docker Hub
            docker pull $DOCKER_USERNAME/vetautet:latest

            # 3. Khởi động lại các container bằng docker-compose-nginx.yml
            export DOCKER_USERNAME=$DOCKER_USERNAME
            docker-compose -f docker-compose-nginx.yml down || true
            docker-compose -f docker-compose-nginx.yml up -d

            # 4. Dọn dẹp các image cũ để tránh đầy ổ cứng
            docker image prune -f